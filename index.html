    <!--
      Fonts. preconnect to BOTH hosts: the stylesheet comes from
      fonts.googleapis.com but the actual font files come from fonts.gstatic.com,
      and without the second hint the browser only starts that second, slower
      connection after it has parsed the CSS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
