<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ClipGrow — Log In</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #080D08; --card: #0F170F; --card-h: #141C12; --border: #1A2C1A; --border-s: #223322;
      --neon: #3DFF7A; --glow-s: rgba(61,255,122,.22); --white: #F0F5F0;
      --text: #C4D4C4; --muted: #566056; --muted-l: #849484; --red: #FF4D4D;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; color: var(--white); }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 8px 48px rgba(0,0,0,.5); }
    .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--white); text-decoration: none; display: block; text-align: center; margin-bottom: 1.6rem; }
    .logo span { color: var(--neon); }

    /* Role toggle -- same pill pattern as index.html's For Clippers/For Brands switch */
    .mode-toggle { position: relative; background: var(--card-h); border: 1px solid var(--border-s); border-radius: 8px; padding: 3px; display: flex; margin: 0 auto 1.8rem; width: fit-content; }
    .mt-btn { position: relative; z-index: 1; padding: .5rem 1.3rem; font-size: .82rem; font-weight: 700; background: transparent; border: none; color: var(--muted-l); cursor: pointer; border-radius: 6px; transition: color .25s; font-family: 'Space Grotesk', sans-serif; }
    .mt-btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
    .mt-btn[aria-pressed="true"] { color: #060E06; }
    .mt-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--neon); border-radius: 5px; transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 14px var(--glow-s); }
    .mt-slider.client { transform: translateX(100%); }

    h1.form-title { font-size: 1.15rem; margin-bottom: 1.4rem; text-align: center }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted-l); margin-bottom: 0.4rem; }
    input { width: 100%; background: #080D08; border: 1px solid var(--border-s); border-radius: 6px; padding: 0.75rem 1rem; color: var(--white); font-family: 'Inter', sans-serif; outline: none; font-size: 0.95rem; }
    input:focus { border-color: var(--neon); }
    .btn { width: 100%; background: var(--neon); color: #060E06; padding: 0.85rem; border-radius: 6px; font-weight: 800; font-family: 'Space Grotesk', sans-serif; border: none; cursor: pointer; font-size: 0.95rem; margin-top: 0.5rem; box-shadow: 0 4px 20px var(--glow-s); }
    .btn:hover { background: var(--white); }
    .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
    .error { color: var(--red); font-size: 0.83rem; margin-top: 1rem; text-align: center; }
    .hint { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 1.5rem; line-height: 1.6; }
    .fld-err { display: none; color: var(--red); font-size: 0.78rem; margin-top: 0.35rem; }
    input.invalid { border-color: var(--red); }
    .switch { font-size: 0.85rem; text-align: center; margin-top: 1.2rem; display: none; }
    .switch a { color: var(--neon); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }
    .switch a:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 3px; }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
  <script src="/components/error-net.js?v=2"></script>
</head>
<body>
  <div class="box">
    <a href="/" class="logo">Clip<span>Grow</span></a>

    <div class="mode-toggle" role="group" aria-label="Log in as">
      <button type="button" class="mt-btn" id="tab-clipper" aria-pressed="false" onclick="setRole('clipper')">Clipper</button>
      <button type="button" class="mt-btn" id="tab-client" aria-pressed="false" onclick="setRole('client')">Client</button>
      <div class="mt-slider" id="mt-slider"></div>
    </div>

    <h1 class="form-title" id="form-title">Clipper Login</h1>
    <form id="login-form">
      <div class="form-group"><label for="username">Username</label><input type="text" id="username" required autocomplete="username" /></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password" /></div>
      <button type="submit" class="btn" id="submit-btn">Log In</button>
      <p class="error" id="error" role="alert" style="display:none">Invalid username or password</p>
    </form>
    <form id="signup-form" novalidate style="display:none">
      <div class="form-group"><label for="su-username">Choose a username</label>
        <input type="text" id="su-username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" />
        <p class="fld-err" id="su-e-username"></p></div>
      <div class="form-group"><label for="su-password">Choose a password</label>
        <input type="password" id="su-password" autocomplete="new-password" maxlength="128" />
        <p class="fld-err" id="su-e-password"></p></div>
      <div class="form-group"><label for="su-confirm">Repeat the password</label>
        <input type="password" id="su-confirm" autocomplete="new-password" maxlength="128" />
        <p class="fld-err" id="su-e-confirm"></p></div>
      <p class="note" style="margin:.4rem 0 .7rem;font-size:.8rem;opacity:.75">How ClipGrow reaches you. Each email, phone number and Discord username can be used on one account only.</p>
      <div class="form-group"><label for="su-email">Email</label>
        <input type="email" id="su-email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" maxlength="254" />
        <p class="fld-err" id="su-e-email"></p></div>
      <div class="form-group"><label for="su-phone">Phone number (WhatsApp)</label>
        <input type="tel" id="su-phone" autocomplete="tel" inputmode="tel" placeholder="9876543210" maxlength="20" />
        <p class="fld-err" id="su-e-phone"></p></div>
      <div class="form-group"><label for="su-discord">Discord username</label>
        <input type="text" id="su-discord" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. yourname" maxlength="33" />
        <p class="fld-err" id="su-e-discord"></p></div>
      <div class="trap" aria-hidden="true"><label>Website <input type="text" id="su-website" tabindex="-1" autocomplete="off" /></label></div>
      <button type="submit" class="btn" id="su-btn">Create account</button>
      <p class="error" id="su-error" role="alert" style="display:none"></p>
    </form>
    <p class="hint" id="hint">Don't have an account? Your ClipGrow admin creates it for you and shares the credentials directly.</p>
    <p class="switch" id="switch"><a href="#" id="switch-link">New here? Create an account</a></p>
  </div>
  <script>
    const COPY = {
      clipper: { title: 'Clipper Login', hint: "Don't have an account? Your ClipGrow admin creates it for you and shares the credentials directly.", endpoint: '/api/clipper/login', redirect: '/dashboard' },
      client:  { title: 'Client Login',  hint: 'This is the brand portal for tracking your live campaign.', endpoint: '/api/client/login', redirect: '/client-dashboard' }
    };
    let role = location.pathname.replace(/\/+$/, '') === '/client' ? 'client' : 'clipper';

    function setRole(next) {
      role = next;
      document.getElementById('tab-clipper').setAttribute('aria-pressed', String(role === 'clipper'));
      document.getElementById('tab-client').setAttribute('aria-pressed', String(role === 'client'));
      document.getElementById('mt-slider').classList.toggle('client', role === 'client');
      document.getElementById('form-title').textContent = COPY[role].title;
      document.getElementById('hint').textContent = COPY[role].hint;
      document.title = 'ClipGrow — ' + COPY[role].title;
      document.getElementById('error').style.display = 'none';
      history.replaceState(null, '', role === 'client' ? '/client' : '/clipper');
      if (window.renderChrome) renderChrome();
    }
    setRole(role);

    /* ── Create an account ──
       Offered only to clippers, and only when the server says sign-up is open.
       The rules come from the same file the server uses, so what is shown while
       typing is what will be enforced. */
    let signupOpen = false, mode = 'login', RULES = null;
    const $ = id => document.getElementById(id);
    const loadRules = async () => RULES || (RULES = await import('/components/account-validation.js?v=1'));
    let PROFILE = null;
    const loadProfile = async () => PROFILE || (PROFILE = await import('/components/profile-validation.js?v=2'));

    window.renderChrome = function () {
      const creating = role === 'clipper' && signupOpen && mode === 'signup';
      if (role !== 'clipper') mode = 'login';
      $('login-form').style.display = creating ? 'none' : '';
      $('signup-form').style.display = creating ? '' : 'none';
      $('form-title').textContent = creating ? 'Create your clipper account' : COPY[role].title;
      // The line about an admin creating accounts is only true while sign-up is closed.
      $('hint').textContent = (role === 'clipper' && signupOpen) ? '' : COPY[role].hint;
      $('hint').style.display = (role === 'clipper' && signupOpen) ? 'none' : '';
      const sw = $('switch');
      sw.style.display = (role === 'clipper' && signupOpen) ? 'block' : 'none';
      $('switch-link').textContent = creating ? 'Already have an account? Log in' : 'New here? Create an account';
    };

    $('switch-link').addEventListener('click', e => {
      e.preventDefault();
      mode = mode === 'signup' ? 'login' : 'signup';
      renderChrome();
      (mode === 'signup' ? $('su-username') : $('username')).focus();
    });

    fetch('/api/clipper/signup').then(r => r.json()).then(d => { signupOpen = !!d.open; renderChrome(); }).catch(() => {});

    function fieldError(id, msg) {
      const out = $('su-e-' + id), inp = $('su-' + id);
      out.textContent = msg || ''; out.style.display = msg ? 'block' : 'none';
      inp.classList.toggle('invalid', !!msg);
      inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
      return msg;
    }
    async function checkUsername() { const R = await loadRules(); return fieldError('username', R.validateUsername($('su-username').value)); }
    async function checkPassword() { const R = await loadRules(); return fieldError('password', R.validatePassword($('su-password').value, $('su-username').value)); }
    async function checkEmail() { const R = await loadProfile(); return fieldError('email', R.validateEmail($('su-email').value)); }
    async function checkPhone() { const R = await loadProfile(); return fieldError('phone', R.validateContactNumber($('su-phone').value)); }
    async function checkDiscord() {
      const R = await loadProfile(), v = $('su-discord').value;
      return fieldError('discord', R.normaliseDiscordUsername(v) ? R.validateDiscordUsername(v) : 'Enter your Discord username');
    }
    function checkConfirm() { return fieldError('confirm', $('su-confirm').value !== $('su-password').value ? 'The two passwords do not match.' : null); }

    // Check a field when the person leaves it, and re-check on each keystroke only
    // once it is already showing a problem, so nobody is nagged mid-word.
    $('su-username').addEventListener('blur', () => { if ($('su-username').value) checkUsername(); });
    $('su-password').addEventListener('blur', () => { if ($('su-password').value) checkPassword(); });
    $('su-confirm').addEventListener('blur', () => { if ($('su-confirm').value) checkConfirm(); });
    $('su-username').addEventListener('input', () => { if ($('su-username').classList.contains('invalid')) checkUsername(); });
    $('su-password').addEventListener('input', () => { if ($('su-password').classList.contains('invalid')) checkPassword(); });
    $('su-confirm').addEventListener('input', () => { if ($('su-confirm').classList.contains('invalid')) checkConfirm(); });
    for (const [id, check] of [['email', checkEmail], ['phone', checkPhone], ['discord', checkDiscord]]) {
      $('su-' + id).addEventListener('blur', () => { if ($('su-' + id).value) check(); });
      $('su-' + id).addEventListener('input', () => { if ($('su-' + id).classList.contains('invalid')) check(); });
    }

    $('signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errorEl = $('su-error'), btn = $('su-btn');
      errorEl.style.display = 'none';
      const order = ['username', 'password', 'confirm', 'email', 'phone', 'discord'];
      const bad = [await checkUsername(), await checkPassword(), checkConfirm(), await checkEmail(), await checkPhone(), await checkDiscord()];
      // Every problem is shown at once, and focus goes to the first, not one round trip per mistake.
      if (bad.some(Boolean)) { $('su-' + order[bad.findIndex(Boolean)]).focus(); return; }
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const res = await fetch('/api/clipper/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: $('su-username').value.trim(), password: $('su-password').value,
            email: $('su-email').value.trim(), contactNumber: $('su-phone').value.trim(), discordUsername: $('su-discord').value.trim(),
            website: $('su-website').value
          })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          // The server says which detail was refused (already used, or invalid): put it
          // under that box. Anything without a field (busy, too many attempts) is the banner.
          if (body.field && $('su-e-' + body.field)) { fieldError(body.field, body.error); $('su-' + body.field).focus(); btn.disabled = false; btn.textContent = 'Create account'; return; }
          throw new Error(body.error || 'Could not create the account. Try again.');
        }
        location.href = '/dashboard';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      errorEl.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch(COPY[role].endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { errorEl.textContent = body.error || 'Invalid username or password'; throw new Error(); }
        location.href = COPY[role].redirect;
      } catch {
        errorEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
