<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ClipGrow — Client Login</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #080D08; --card: #0F170F; --border: #1A2C1A; --border-s: #223322;
      --neon: #3DFF7A; --glow-s: rgba(61,255,122,.22); --white: #F0F5F0;
      --text: #C4D4C4; --muted: #566056; --muted-l: #849484; --red: #FF4D4D;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; color: var(--white); }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 8px 48px rgba(0,0,0,.5); }
    .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--white); text-decoration: none; display: block; text-align: center; margin-bottom: 2rem; }
    .logo span { color: var(--neon); }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted-l); margin-bottom: 0.4rem; }
    input { width: 100%; background: #080D08; border: 1px solid var(--border-s); border-radius: 6px; padding: 0.75rem 1rem; color: var(--white); font-family: 'Inter', sans-serif; outline: none; font-size: 0.95rem; }
    input:focus { border-color: var(--neon); }
    .btn { width: 100%; background: var(--neon); color: #060E06; padding: 0.85rem; border-radius: 6px; font-weight: 800; font-family: 'Space Grotesk', sans-serif; border: none; cursor: pointer; font-size: 0.95rem; margin-top: 0.5rem; box-shadow: 0 4px 20px var(--glow-s); }
    .btn:hover { background: var(--white); }
    .error { color: var(--red); font-size: 0.83rem; margin-top: 1rem; text-align: center; display: none; }
    .hint { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 1.5rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <a href="index.html" class="logo">Clip<span>Grow</span></a>
    <h1 style="font-size: 1.2rem; margin-bottom: 1.5rem; text-align: center">Client Login</h1>
    <form id="login-form">
      <div class="form-group"><label>Username</label><input type="text" id="username" required autocomplete="username" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required autocomplete="current-password" /></div>
      <button type="submit" class="btn">Log In</button>
      <p class="error" id="error">Invalid username or password</p>
    </form>
    <p class="hint">This is the brand portal for tracking your live campaign. Clippers should use the clipper login instead.</p>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await fetch('/api/client/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { errorEl.textContent = body.error || 'Invalid username or password'; throw new Error(); }
        location.href = '/client-dashboard';
      } catch {
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
